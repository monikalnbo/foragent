[package]
name = "myagent_runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "myagent_runtime"
path = "src/main.rs"

[lib]
name = "myagent_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
myagent_types = { path = "../engine/types" }
myagent_core = { path = "../engine/core" }
myagent_capability = { path = "../engine/capability" }
myagent_protocol = { path = "../engine/protocol" }
myagent_sandbox = { path = "../engine/sandbox" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
