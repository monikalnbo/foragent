name: Build & Package Dynamic Libraries and UI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Syntax Check
        run: cargo check --workspace

      - name: Build Release Binaries & Dynamic Libraries
        run: cargo build --release --workspace

      - name: Prepare Windows Artifacts & Build EXE/MSI Installers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item target/release/*.dll dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item target/release/myagent_ui.exe dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item target/release/myagent_runtime.exe dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item myagent.toml dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item installer/windows/* dist-windows/ -Force -ErrorAction SilentlyContinue

          # 1. 压缩当前全部已编译二进制与依赖，注入到纯 Rust 单文件安装器
          Compress-Archive -Path dist-windows/* -DestinationPath installer/setup/payload.zip -Force
          cargo build --release -p myagent_setup
          Copy-Item target/release/AgentOS-Setup-x64.exe dist-windows/ -Force
          Write-Host ">>> 纯 Rust 单文件 EXE 安装器已生成: dist-windows/AgentOS-Setup-x64.exe" -ForegroundColor Green

          # 2. 编译 Windows 自带的原生 Windows Installer (MSI) 安装包
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
              candle.exe -arch x64 -out target/installer.wixobj installer/wix/main.wxs
              light.exe -sval -out dist-windows/AgentOS-Setup-x64.msi target/installer.wixobj
              Write-Host ">>> Windows 原生 MSI 安装包生成成功: dist-windows/AgentOS-Setup-x64.msi" -ForegroundColor Green
          }

      - name: Upload Windows MSI & Release Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: myagent-windows-x64
          path: dist-windows/

      - name: Publish Single-File EXE Installer to GitHub Releases
        if: matrix.os == 'windows-latest' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "AgentOS Studio v0.1.0 (Single-File EXE Installer)"
          body: |
            ## 🚀 AgentOS Studio 纯 Rust 原生智能体系统
            
            ### 📥 快速下载安装（无需解压）：
            - 点击下方 Assets 中的 **`AgentOS-Setup-x64.exe`** 直接下载单个安装程序！
            - 下载后直接双击该 `.exe` 即可完成安装并自动创建桌面快捷方式。
          files: |
            dist-windows/AgentOS-Setup-x64.exe
            dist-windows/AgentOS-Setup-x64.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist-linux
          cp target/release/*.so dist-linux/ 2>/dev/null || true
          cp target/release/myagent_ui dist-linux/ 2>/dev/null || true
          cp target/release/myagent_runtime dist-linux/ 2>/dev/null || true
          cp myagent.toml dist-linux/ 2>/dev/null || true
          echo "Linux build artifacts packaged successfully."

      - name: Upload Linux Dynamic Libraries & UI Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: myagent-linux-x64
          path: dist-linux/
