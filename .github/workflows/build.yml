name: Build & Package Dynamic Libraries and UI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Syntax Check
        run: cargo check --workspace

      - name: Build Release Binaries & Dynamic Libraries
        run: cargo build --release --workspace

      - name: Prepare Windows Artifacts & Build Official Windows Installers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item target/release/*.dll dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item target/release/myagent_ui.exe dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item target/release/myagent_runtime.exe dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item myagent.toml dist-windows/ -Force -ErrorAction SilentlyContinue
          Copy-Item installer/windows/* dist-windows/ -Force -ErrorAction SilentlyContinue

          # 1. 制作免安装绿色便携版 zip (解压后直接双击 myagent_ui.exe 即可秒开)
          Compress-Archive -Path dist-windows/* -DestinationPath dist-windows/AgentOS-Studio-Portable-x64.zip -Force
          Write-Host ">>> 免安装便携版打包成功: dist-windows/AgentOS-Studio-Portable-x64.zip" -ForegroundColor Green

          # 2. 编译 Windows 现代标准 NSIS EXE 安装器 (Nullsoft Scriptable Install System)
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
              choco install nsis -y --no-progress
          }
          $nsisPath = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsisPath) {
              $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $nsisPath)) {
              $nsisPath = "C:\Program Files\NSIS\makensis.exe"
          }
          & $nsisPath installer/nsis/setup.nsi
          Write-Host ">>> 现代 NSIS EXE 安装器生成成功: dist-windows/AgentOS-Setup-x64.exe" -ForegroundColor Green

          # 3. 编译 Windows 标准 Windows Installer (MSI)
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
              candle.exe -arch x64 -ext WixUIExtension -out target/installer.wixobj installer/wix/main.wxs
              light.exe -ext WixUIExtension -sval -out dist-windows/AgentOS-Setup-x64.msi target/installer.wixobj
              Write-Host ">>> Windows 原生 MSI 安装包生成成功: dist-windows/AgentOS-Setup-x64.msi" -ForegroundColor Green
          }

      - name: Upload Windows MSI & Release Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: myagent-windows-x64
          path: dist-windows/

      - name: Publish Official Windows Installers to GitHub Releases
        if: matrix.os == 'windows-latest' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "AgentOS Studio v0.1.0 (Windows Official Release)"
          body: |
            ## 🚀 AgentOS Studio 纯 Rust 原生智能体系统 (v0.1.0)
            
            ### 📦 官方 Windows 安装包资源（推荐首选）：
            - 🚀 **[AgentOS-Setup-x64.exe](https://github.com/monikalnbo/foragent/releases/download/v0.1.0/AgentOS-Setup-x64.exe)**（NSIS 现代单文件 EXE 安装器：原生 Modern UI、简体中文极速向导、自动创建桌面快捷方式、一键启动）
            - 💼 **[AgentOS-Studio-Portable-x64.zip](https://github.com/monikalnbo/foragent/releases/download/v0.1.0/AgentOS-Studio-Portable-x64.zip)**（免安装绿色便携版：解压后双击 `myagent_ui.exe` 直接运行）
            - 📦 **[AgentOS-Setup-x64.msi](https://github.com/monikalnbo/foragent/releases/download/v0.1.0/AgentOS-Setup-x64.msi)**（Windows 企业标准 MSI 安装包）
          files: |
            dist-windows/AgentOS-Setup-x64.exe
            dist-windows/AgentOS-Studio-Portable-x64.zip
            dist-windows/AgentOS-Setup-x64.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist-linux
          cp target/release/*.so dist-linux/ 2>/dev/null || true
          cp target/release/myagent_ui dist-linux/ 2>/dev/null || true
          cp target/release/myagent_runtime dist-linux/ 2>/dev/null || true
          cp myagent.toml dist-linux/ 2>/dev/null || true
          echo "Linux build artifacts packaged successfully."

      - name: Upload Linux Dynamic Libraries & UI Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: myagent-linux-x64
          path: dist-linux/
